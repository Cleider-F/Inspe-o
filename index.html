<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Inspeções</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="header">Sistema de Inspeção</div>

<div class="container">

  <!-- 🔢 CONTADORES -->
  <div id="contadores" style="display:flex; gap:10px; flex-wrap:wrap;"></div>

  <!-- 🔎 FILTROS -->
  <input 
    id="busca" 
    placeholder="Buscar por placa/GO"
    oninput="aplicarFiltros()"
  >

  <select id="filtroStatus" onchange="aplicarFiltros()">
    <option value="TODOS">Todos</option>
    <option value="EM_INSPECAO">Em inspeção</option>
    <option value="AGUARDANDO_MANUTENCAO">Manutenção</option>
    <option value="AGUARDANDO_REINSPECAO">Reinspeção</option>
    <option value="LIBERADO">Liberado</option>
  </select>

  <button onclick="nova()">+ Nova Inspeção</button>

  <div id="lista"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/dashboard.js"></script>


<div class="bottom-nav">
  <button onclick="go('index.html')" id="nav-dashboard">
    🏠
    <span>Home</span>
  </button>

  <button onclick="go('nova.html')" id="nav-nova">
    ➕
    <span>Nova</span>
  </button>

  <button onclick="go('index.html?filtro=AGUARDANDO_MANUTENCAO')" id="nav-manutencao">
    🔧
    <span>Manut.</span>
  </button>

  <button onclick="go('index.html?filtro=AGUARDANDO_REINSPECAO')" id="nav-reinspecao">
    🔍
    <span>Reinsp.</span>
  </button>
</div>
</body>
</html>
